<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE MASTER CATALOGUE — Autonomous Daily OTT & Cinephile Radar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
  <style>
    body { background-color: #070709; color: #f4f4f6; font-family: 'Inter', sans-serif; }
    .serif-title { font-family: 'Playfair Display', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen selection:bg-amber-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const PLATFORM_META = {
      india: [
        { key: "netflix", name: "Netflix India", accent: "from-red-600/20 to-transparent", badge: "bg-red-600 text-white" },
        { key: "prime", name: "Prime Video India", accent: "from-sky-500/20 to-transparent", badge: "bg-sky-500 text-black font-bold" },
        { key: "jiohotstar", name: "JioHotstar", accent: "from-indigo-500/20 to-transparent", badge: "bg-indigo-600 text-white" },
        { key: "sonyliv", name: "SonyLIV", accent: "from-emerald-500/20 to-transparent", badge: "bg-emerald-500 text-black font-bold" },
        { key: "zee5", name: "ZEE5", accent: "from-purple-500/20 to-transparent", badge: "bg-purple-600 text-white" }
      ],
      global: [
        { key: "netflix", name: "Netflix Global", accent: "from-red-600/20 to-transparent", badge: "bg-red-600 text-white" },
        { key: "prime", name: "Prime Video Global", accent: "from-sky-500/20 to-transparent", badge: "bg-sky-500 text-black font-bold" },
        { key: "max", name: "HBO Max", accent: "from-blue-600/20 to-transparent", badge: "bg-blue-600 text-white" },
        { key: "disney", name: "Disney+", accent: "from-cyan-500/20 to-transparent", badge: "bg-cyan-500 text-black font-bold" },
        { key: "apple", name: "Apple TV+", accent: "from-zinc-400/20 to-transparent", badge: "bg-zinc-200 text-black font-bold" }
      ]
    };

    function App() {
      const [catalogue, setCatalogue] = useState(null);
      const [activeTab, setActiveTab] = useState("india");
      const [selectedPlatform, setSelectedPlatform] = useState("all");
      const [goldOnly, setGoldOnly] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const ts = "?t=" + new Date().getTime();
        fetch("./daily_catalogue.json" + ts)
          .then(r => {
            if (!r.ok) throw new Error("Root JSON not found");
            return r.json();
          })
          .catch(() => fetch("./public/daily_catalogue.json" + ts).then(r => r.json()))
          .then(data => {
            if (data && data.india) setCatalogue(data);
            setLoading(false);
          })
          .catch(err => {
            console.error("Failed to load catalogue JSON:", err);
            setLoading(false);
          });
      }, []);

      const handleTabChange = (tab) => {
        setActiveTab(tab);
        setSelectedPlatform("all");
      };

      const filterItem = (item) => {
        const numImdb = parseFloat(item.imdb) || 0;
        if (goldOnly && numImdb < 7.8) return false;
        if (searchQuery.trim() !== "") {
          const q = searchQuery.toLowerCase();
          const matchTitle = (item.title || "").toLowerCase().includes(q);
          const matchTag = (item.tag || "").toLowerCase().includes(q);
          const matchVerdict = (item.verdict || "").toLowerCase().includes(q);
          const matchDir = (item.director || "").toLowerCase().includes(q);
          return matchTitle || matchTag || matchVerdict || matchDir;
        }
        return true;
      };

      if (loading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-[#070709] text-zinc-400">
            <div className="w-10 h-10 border-2 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-xs uppercase tracking-widest text-amber-400">Syncing Daily Master Catalogue...</p>
          </div>
        );
      }

      if (!catalogue) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6 text-center">
            <div className="max-w-md bg-zinc-900/80 border border-zinc-800 rounded-2xl p-6">
              <h2 className="text-lg font-bold text-white mb-2">Awaiting Initial Sync</h2>
              <p className="text-sm text-zinc-400">Run the GitHub Actions workflow once to generate daily_catalogue.json.</p>
            </div>
          </div>
        );
      }

      const platformsToShow = activeTab === "beyond"
        ? []
        : PLATFORM_META[activeTab].filter(p => selectedPlatform === "all" || p.key === selectedPlatform);

      return (
        <div className="min-h-screen pb-20">
          {/* Top Navigation & Status Header */}
          <header className="sticky top-0 z-40 backdrop-blur-xl bg-[#070709]/90 border-b border-zinc-800/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2.5">
                    <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span className="text-[11px] font-semibold uppercase tracking-widest text-emerald-400">
                      {catalogue.syncMode || "LIVE AUTO-SYNC"} • {catalogue.syncDate}
                    </span>
                  </div>
                  <h1 className="serif-title text-2xl sm:text-3xl font-bold tracking-tight text-white mt-0.5">
                    The Master Catalogue
                  </h1>
                </div>

                {/* Search & Gold Filter Controls */}
                <div className="flex flex-wrap items-center gap-2.5">
                  <div className="relative flex-1 sm:flex-initial">
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      placeholder="Search title, genre, director..."
                      className="w-full sm:w-64 bg-zinc-900/90 border border-zinc-800 focus:border-amber-500/70 rounded-xl px-3.5 py-2 text-xs text-white placeholder-zinc-500 outline-none transition"
                    />
                    {searchQuery && (
                      <button
                        onClick={() => setSearchQuery("")}
                        className="absolute right-2.5 top-2 text-xs text-zinc-400 hover:text-white"
                      >
                        ✕
                      </button>
                    )}
                  </div>

                  <button
                    onClick={() => setGoldOnly(!goldOnly)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-semibold border transition flex items-center gap-1.5 ${
                      goldOnly
                        ? "bg-amber-500 text-black border-amber-400 shadow-lg shadow-amber-500/20"
                        : "bg-zinc-900/90 text-amber-400 border-zinc-800 hover:border-amber-500/50"
                    }`}
                  >
                    <span>★</span>
                    <span>Critical Gold (7.8+)</span>
                  </button>
                </div>
              </div>

              {/* Primary Region / Radar Tabs */}
              <div className="flex items-center justify-between mt-4 pt-3 border-t border-zinc-900 flex-wrap gap-3">
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => handleTabChange("india")}
                    className={`px-4 py-1.5 rounded-lg text-xs font-bold tracking-wide transition ${
                      activeTab === "india" ? "bg-white text-black" : "bg-zinc-900 text-zinc-400 hover:text-white"
                    }`}
                  >
                    🇮🇳 INDIA OTT TOP 10
                  </button>
                  <button
                    onClick={() => handleTabChange("global")}
                    className={`px-4 py-1.5 rounded-lg text-xs font-bold tracking-wide transition ${
                      activeTab === "global" ? "bg-white text-black" : "bg-zinc-900 text-zinc-400 hover:text-white"
                    }`}
                  >
                    🌍 GLOBAL OTT TOP 10
                  </button>
                  <button
                    onClick={() => handleTabChange("beyond")}
                    className={`px-4 py-1.5 rounded-lg text-xs font-bold tracking-wide transition ${
                      activeTab === "beyond"
                        ? "bg-amber-500 text-black"
                        : "bg-zinc-900 text-amber-400/90 hover:bg-zinc-800"
                    }`}
                  >
                    🎞️ FESTIVAL & 4K BLINDSPOTS
                  </button>
                </div>

                {/* Sub-Platform Filter Pills */}
                {activeTab !== "beyond" && (
                  <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                    <button
                      onClick={() => setSelectedPlatform("all")}
                      className={`px-2.5 py-1 rounded-md text-[11px] font-medium transition ${
                        selectedPlatform === "all" ? "bg-zinc-700 text-white" : "text-zinc-400 hover:text-white"
                      }`}
                    >
                      All 5 Platforms
                    </button>
                    {PLATFORM_META[activeTab].map(p => (
                      <button
                        key={p.key}
                        onClick={() => setSelectedPlatform(p.key)}
                        className={`px-2.5 py-1 rounded-md text-[11px] font-medium transition whitespace-nowrap ${
                          selectedPlatform === p.key ? p.badge : "text-zinc-400 hover:text-white bg-zinc-900/60"
                        }`}
                      >
                        {p.name}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 mt-8 space-y-10">
            {activeTab !== "beyond" ? (
              platformsToShow.map(platform => {
                const rawList = (catalogue[activeTab] && catalogue[activeTab][platform.key]) || [];
                const items = rawList.filter(filterItem);

                return (
                  <section key={platform.key} className="space-y-4">
                    <div className={`flex items-center justify-between p-3.5 rounded-xl bg-gradient-to-r ${platform.accent} border border-zinc-800/80`}>
                      <div className="flex items-center gap-3">
                        <span className={`px-2.5 py-0.5 rounded text-xs uppercase tracking-wider ${platform.badge}`}>
                          {platform.name}
                        </span>
                        <span className="text-xs text-zinc-400">
                          Showing {items.length} of {rawList.length} Trending Titles
                        </span>
                      </div>
                    </div>

                    {items.length === 0 ? (
                      <div className="text-xs text-zinc-500 py-6 pl-2">
                        No titles match the current filter on {platform.name}.
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                        {items.map(item => {
                          const isGold = (parseFloat(item.imdb) || 0) >= 7.8;
                          const imdbSearchUrl = `https://www.imdb.com/find/?q=${encodeURIComponent(item.title)}`;
                          const ytTrailerUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(item.title + " " + (item.year || "") + " official trailer")}`;

                          return (
                            <div
                              key={item.rank + item.title}
                              className={`group relative rounded-xl overflow-hidden bg-zinc-900/70 border transition-all duration-300 flex flex-col justify-between ${
                                isGold
                                  ? "border-amber-500/40 hover:border-amber-400 shadow-lg shadow-amber-500/5"
                                  : "border-zinc-800/80 hover:border-zinc-600"
                              }`}
                            >
                              <div>
                                <div className="relative aspect-[2/3] w-full bg-zinc-950 overflow-hidden">
                                  <img
                                    src={item.poster}
                                    alt={item.title}
                                    loading="lazy"
                                    onError={(e) => {
                                      e.target.onerror = null;
                                      e.target.src = "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600&q=80";
                                    }}
                                    className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                                  />
                                  <div className="absolute inset-0 bg-gradient-to-t from-[#070709] via-transparent to-black/40" />

                                  {/* Top Left Rank */}
                                  <div className="absolute top-2.5 left-2.5 bg-black/80 backdrop-blur-md border border-zinc-700 px-2 py-0.5 rounded-md text-xs font-extrabold text-white">
                                    #{item.rank}
                                  </div>

                                  {/* Top Right IMDb Badge */}
                                  <div className={`absolute top-2.5 right-2.5 px-2 py-0.5 rounded-md text-xs font-bold flex items-center gap-1 backdrop-blur-md ${
                                    isGold ? "bg-amber-400 text-black" : "bg-black/80 text-zinc-200 border border-zinc-700"
                                  }`}>
                                    <span>★</span>
                                    <span>{item.imdb}</span>
                                  </div>

                                  {/* Bottom Verdict Pill */}
                                  <div className="absolute bottom-2 left-2.5 right-2.5 flex items-center justify-between gap-1">
                                    <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded ${
                                      isGold ? "bg-amber-500/90 text-black" : "bg-zinc-800/90 text-zinc-200"
                                    }`}>
                                      {item.verdict}
                                    </span>
                                    <span className="text-[10px] bg-black/75 text-zinc-300 px-1.5 py-0.5 rounded border border-zinc-800">
                                      {item.type}
                                    </span>
                                  </div>
                                </div>

                                <div className="p-3">
                                  <h3 className="font-bold text-sm text-white line-clamp-1 group-hover:text-amber-400 transition">
                                    {item.title}
                                  </h3>
                                  <p className="text-[11px] text-zinc-400 mt-0.5">
                                    {item.year} • {item.tag}
                                  </p>
                                </div>
                              </div>

                              <div className="px-3 pb-3 pt-1 flex items-center gap-2 border-t border-zinc-800/60">
                                <a
                                  href={imdbSearchUrl}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="flex-1 text-center py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-[11px] font-medium text-zinc-200 transition"
                                >
                                  IMDb
                                </a>
                                <a
                                  href={ytTrailerUrl}
                                  target="_blank"
                                  rel="noopener noreferrer"
                                  className="flex-1 text-center py-1 rounded bg-amber-500/15 hover:bg-amber-500/25 text-[11px] font-medium text-amber-300 border border-amber-500/30 transition"
                                >
                                  Trailer ↗
                                </a>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </section>
                );
              })
            ) : (
              /* BEYOND / FESTIVAL & 4K RESTORATION RADAR */
              <section className="space-y-5">
                <div className="p-4 rounded-2xl bg-gradient-to-r from-amber-500/15 via-zinc-900 to-zinc-900 border border-amber-500/30">
                  <h2 className="serif-title text-xl font-bold text-amber-400">
                    Festival Circuit, Auteur Blindspots & 4K Archival Restorations
                  </h2>
                  <p className="text-xs text-zinc-300 mt-1">
                    Curated highlights from Cannes, Venice, TIFF, MUBI, and The Criterion Collection.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  {(catalogue.beyond || []).filter(filterItem).map((gem, idx) => {
                    const imdbUrl = `https://www.imdb.com/find/?q=${encodeURIComponent(gem.title)}`;
                    const trailerUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(gem.title + " " + gem.director + " trailer")}`;
                    return (
                      <div
                        key={idx}
                        className="flex gap-4 bg-zinc-900/70 border border-zinc-800 hover:border-amber-500/50 rounded-2xl p-4 transition"
                      >
                        {gem.poster && (
                          <img
                            src={gem.poster}
                            alt={gem.title}
                            className="w-24 sm:w-28 aspect-[2/3] object-cover rounded-xl bg-zinc-950 flex-shrink-0 border border-zinc-800"
                          />
                        )}
                        <div className="flex flex-col justify-between flex-1">
                          <div>
                            <div className="flex items-center justify-between gap-2">
                              <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                {gem.event}
                              </span>
                              <span className="text-xs font-bold text-amber-400">★ {gem.imdb}</span>
                            </div>
                            <h3 className="text-base font-bold text-white mt-2">
                              {gem.title} <span className="text-xs font-normal text-zinc-400">({gem.year})</span>
                            </h3>
                            <p className="text-xs text-zinc-400 font-medium">
                              Directed by <span className="text-zinc-200">{gem.director}</span> • <span className="text-emerald-400">{gem.where}</span>
                            </p>
                            <p className="text-xs text-zinc-300 mt-2 leading-relaxed">
                              {gem.note}
                            </p>
                          </div>

                          <div className="flex items-center gap-2 mt-3 pt-2 border-t border-zinc-800/70">
                            <a
                              href={imdbUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="px-3 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-[11px] font-medium text-zinc-200 transition"
                            >
                              IMDb Page
                            </a>
                            <a
                              href={trailerUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="px-3 py-1 rounded bg-amber-500/15 hover:bg-amber-500/25 text-[11px] font-medium text-amber-300 border border-amber-500/30 transition"
                            >
                              Watch Trailer ↗
                            </a>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

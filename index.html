        netflix: { name: "Netflix India", color: "text-red-500", border: "border-red-500/30", bg: "bg-red-500/10" },
        prime: { name: "Prime Video India", color: "text-sky-400", border: "border-sky-400/30", bg: "bg-sky-400/10" },
        jiohotstar: { name: "JioHotstar", color: "text-blue-500", border: "border-blue-500/30", bg: "bg-blue-500/10" },
        sonyliv: { name: "SonyLIV", color: "text-amber-500", border: "border-amber-500/30", bg: "bg-amber-500/10" },
        zee5: { name: "ZEE5", color: "text-purple-400", border: "border-purple-400/30", bg: "bg-purple-400/10" },
        max: { name: "Max (HBO)", color: "text-violet-400", border: "border-violet-400/30", bg: "bg-violet-400/10" },
        disney: { name: "Disney+", color: "text-blue-400", border: "border-blue-400/30", bg: "bg-blue-400/10" },
        apple: { name: "Apple TV+", color: "text-gray-300", border: "border-gray-500/30", bg: "bg-gray-500/10" }
      };

      return (
        <div className="min-h-screen bg-[#0b0f19] text-gray-100">
          {/* Header */}
          <header className="sticky top-0 z-50 bg-[#0f172a]/95 backdrop-blur border-b border-gray-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-xl bg-amber-500 flex items-center justify-center font-black text-black text-xl shadow-lg shadow-amber-500/20">
                M
              </div>
              <div>
                <h1 className="text-lg font-black tracking-widest uppercase bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600 bg-clip-text text-transparent">
                  THE MASTER CATALOGUE
                </h1>
                <p className="text-[11px] text-gray-400 tracking-wider">UNIVERSAL OTT & AUTEUR RADAR</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={() => setFilterGold(!filterGold)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition flex items-center gap-1.5 ${filterGold ? 'bg-amber-500 text-black border-amber-400 shadow-md shadow-amber-500/20' : 'bg-gray-900 text-amber-400 border-amber-500/30 hover:border-amber-500'}`}
              >
                <span>★</span> {filterGold ? 'Showing Gold Only (7.8+)' : 'Filter Gold (7.8+)'}
              </button>

              <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-emerald-950/60 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Active 2026 Feed</span>
              </div>
            </div>
          </header>

          {/* Main Navigation Tabs */}
          <div className="max-w-7xl mx-auto px-4 sm:px-6 pt-6">
            <div className="flex flex-wrap items-center justify-between gap-4 border-b border-gray-800 pb-4">
              <div className="flex space-x-2">
                <button
                  onClick={() => { setView('india'); setActivePlatform('all'); }}
                  className={`px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition ${view === 'india' ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20' : 'bg-gray-900 text-gray-400 hover:text-white'}`}
                >
                  🇮🇳 India OTTs (5 Platforms)
                </button>
                <button
                  onClick={() => { setView('global'); setActivePlatform('all'); }}
                  className={`px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition ${view === 'global' ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20' : 'bg-gray-900 text-gray-400 hover:text-white'}`}
                >
                  🌍 Global OTTs (5 Platforms)
                </button>
                <button
                  onClick={() => setView('beyond')}
                  className={`px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition ${view === 'beyond' ? 'bg-amber-500 text-black shadow-lg shadow-amber-500/20' : 'bg-gray-900 text-gray-400 hover:text-white'}`}
                >
                  ✨ Beyond Major OTTs (Auteur)
                </button>
              </div>

              {/* Sub-Filters for Individual Platforms */}
              {view !== 'beyond' && (
                <div className="flex items-center space-x-1 overflow-x-auto py-1">
                  <span className="text-[11px] text-gray-500 uppercase mr-2 font-bold">Platform:</span>
                  {['all', ...(view === 'india' ? ['netflix', 'prime', 'jiohotstar', 'sonyliv', 'zee5'] : ['netflix', 'prime', 'max', 'disney', 'apple'])].map(p => (
                    <button
                      key={p}
                      onClick={() => setActivePlatform(p)}
                      className={`px-3 py-1 rounded-md text-[11px] font-bold uppercase transition ${activePlatform === p ? 'bg-gray-200 text-black' : 'bg-gray-900 text-gray-400 hover:text-white'}`}
                    >
                      {p === 'all' ? 'All Rows' : p}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Content Body */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
            {view === 'india' && (
              <div className="space-y-12">
                {Object.entries(catalogue.india)
                  .filter(([key]) => activePlatform === 'all' || activePlatform === key)
                  .map(([platformKey, items]) => {
                    const cfg = platformConfig[platformKey] || { name: platformKey, color: "text-amber-400" };
                    const filteredItems = filterGold ? items.filter(i => parseFloat(i.imdb) >= 7.8) : items;
                    return (
                      <section key={platformKey}>
                        <div className="flex items-center justify-between mb-4">
                          <h2 className={`text-xl font-black flex items-center gap-2 ${cfg.color}`}>
                            <span className="w-2.5 h-2.5 rounded-full bg-current"></span>
                            {cfg.name} — Top 10 Today
                          </h2>
                          <span className="text-xs text-gray-500 font-semibold">{filteredItems.length} Titles Listed</span>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                          {filteredItems.map(renderCard)}
                        </div>
                      </section>
                    );
                  })}
              </div>
            )}

            {view === 'global' && (
              <div className="space-y-12">
                {Object.entries(catalogue.global)
                  .filter(([key]) => activePlatform === 'all' || activePlatform === key)
                  .map(([platformKey, items]) => {
                    const cfg = platformConfig[platformKey] || { name: platformKey, color: "text-blue-400" };
                    const filteredItems = filterGold ? items.filter(i => parseFloat(i.imdb) >= 7.8) : items;
                    return (
                      <section key={platformKey}>
                        <div className="flex items-center justify-between mb-4">
                          <h2 className={`text-xl font-black flex items-center gap-2 ${cfg.color}`}>
                            <span className="w-2.5 h-2.5 rounded-full bg-current"></span>
                            {cfg.name} — Global Top Trending
                          </h2>
                          <span className="text-xs text-gray-500 font-semibold">{filteredItems.length} Titles</span>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                          {filteredItems.map(renderCard)}
                        </div>
                      </section>
                    );
                  })}
              </div>
            )}

            {view === 'beyond' && (
              <section>
                <div className="mb-6">
                  <h2 className="text-2xl font-black text-amber-400">✨ Beyond Major OTTs (The Blindspot & Festival Radar)</h2>
                  <p className="text-sm text-gray-400 mt-1">Cannes, Venice, Film Foundation 4K restorations, and auteur cinema outside the mainstream algorithms.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {catalogue.beyond.map((item, idx) => (
                    <div key={idx} className="bg-gray-900/90 border border-amber-500/30 rounded-2xl p-6 hover:border-amber-400 transition shadow-xl">
                      <div className="flex justify-between items-start">
                        <span className="px-3 py-1 rounded-full text-[11px] font-black uppercase tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/20">
                          {item.event}
                        </span>
                        <span className="px-2.5 py-1 rounded-lg bg-black/60 border border-amber-400/30 text-amber-400 font-black text-xs">
                          ★ {item.imdb}
                        </span>
                      </div>
                      <h3 className="text-xl font-bold text-white mt-4">{item.title}</h3>
                      <p className="text-xs text-gray-400 mt-0.5">Dir. {item.director} • ({item.year})</p>
                      <p className="text-sm text-gray-300 mt-4 leading-relaxed font-normal">{item.note}</p>
                      <div className="mt-6 pt-4 border-t border-gray-800 flex items-center justify-between text-xs">
                        <span className="text-gray-500 font-medium">Where to find:</span>
                        <span className="text-amber-300 font-bold">{item.where}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}
          </main>
        </div>
      );

      function renderCard(item) {
        return (
          <div key={item.title} className="group relative bg-[#0f172a] rounded-xl overflow-hidden border border-gray-800/80 hover:border-gray-600 transition flex flex-col justify-between shadow-lg">
            <div className="relative aspect-[2/3] w-full overflow-hidden bg-gray-950">
              <img 
                src={item.poster} 
                alt={item.title}
                className="w-full h-full object-cover group-hover:scale-105 transition duration-500 opacity-90 group-hover:opacity-100"
                loading="lazy"
              />
              <div className="absolute top-2 left-2 w-7 h-7 rounded-lg bg-black/75 backdrop-blur flex items-center justify-center font-black text-xs text-white border border-white/10">
                #{item.rank}
              </div>
              <div className="absolute top-2 right-2 px-2 py-0.5 rounded-md bg-black/75 backdrop-blur flex items-center gap-1 font-bold text-xs text-amber-400 border border-amber-400/20">
                ★ {item.imdb}
              </div>
              <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-[#0f172a] via-[#0f172a]/60 to-transparent p-3 pt-8">
                <span className="text-[10px] font-semibold uppercase tracking-wider text-amber-400/90">{item.tag}</span>
                <h3 className="text-sm font-bold text-white line-clamp-1 leading-snug">{item.title}</h3>
              </div>
            </div>
            <div className="p-3 border-t border-gray-800/60 bg-[#0f172a]">
              <div className="flex items-center justify-between">
                <span className="text-[11px] text-gray-400">{item.type} • {item.year}</span>
                <span className="text-[11px] font-medium text-emerald-400 truncate max-w-[110px]">{item.verdict}</span>
              </div>
            </div>
          </div>
        );
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

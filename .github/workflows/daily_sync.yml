name: Daily OTT & Cinephile Sync Engine

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 5:30 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Run Sync Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
         python daily_sync.py

      - name: Commit and Push Updated Catalogue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync daily OTT catalogue [skip ci]" && git push)

name: Daily Universal OTT Catalogue Sync

on:
  schedule:
    # Runs automatically every morning at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run Daily OTT & Festival Radar Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/daily_sync.py

      - name: Commit & Push Updated Daily Catalogue JSON
        run: |
          git config --global user.name "Master Catalogue Auto-Bot"
          git config --global user.email "bot@mastercatalogue.local"
          git add public/daily_catalogue.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): auto-update daily OTT Top 10s [skip ci]" && git push)
